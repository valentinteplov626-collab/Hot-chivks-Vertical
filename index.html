* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    background: #000;
}

body {
    display: flex;
    justify-content: center;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

    color: #fff;

    -webkit-tap-highlight-color: transparent;
}

.app-wrapper {

    width: 100%;
    max-width: 480px;

    background: #0d0d11;

    min-height: 100vh;

    display: flex;
    flex-direction: column;

    position: relative;

    padding-bottom: 90px;
}


/* =========================
   HEADER
========================= */

.header-top {

    display: flex;

    justify-content: space-between;

    align-items: center;

    padding: 15px;
}

.logo {

    font-size: 24px;

    font-weight: 900;

    letter-spacing: 2px;

    text-transform: uppercase;

    color: #fff;

    display: flex;

    align-items: center;

    gap: 6px;
}

.logo span {

    line-height: 1;
}

.logo-dot {

    color: #00e5ff;

    font-size: 18px;
}

.auth-buttons {

    display: flex;

    gap: 8px;
}

.btn-sign {

    background: transparent;

    border: 2px solid #00e5ff;

    color: #fff;

    padding: 6px 10px;

    font-size: 11px;

    font-weight: bold;

    border-radius: 2px;

    text-transform: uppercase;
}

.btn-join {

    background: #00e5ff;

    border: 2px solid #00e5ff;

    color: #000;

    padding: 6px 10px;

    font-size: 11px;

    font-weight: bold;

    border-radius: 2px;

    text-transform: uppercase;
}


/* =========================
   NAVIGATION
========================= */

.nav-categories {

    display: flex;

    padding: 0 15px;

    gap: 18px;

    border-bottom: 1px solid #222;

    overflow-x: auto;

    scrollbar-width: none;
}

.nav-categories::-webkit-scrollbar {
    display: none;
}

.nav-item {

    color: #aaa;

    text-decoration: none;

    font-size: 12px;

    font-weight: bold;

    padding: 10px 0;

    text-transform: uppercase;

    white-space: nowrap;
}

.nav-item.active {

    color: #00e5ff;

    border-bottom: 2px solid #00e5ff;
}

.nav-item.premium {

    color: #ffd700;
}


/* =========================
   MAIN PLAYER 9:16
========================= */

.hero-container {

    position: relative;

    width: 100%;

    aspect-ratio: 9 / 16;

    background: #111;

    margin-top: 15px;

    overflow: hidden;
}

.xh-frame {

    position: absolute;

    inset: 0;

    width: 100%;

    height: 100%;

    object-fit: cover;

    opacity: 0;

    transition: opacity 0.5s ease;
}

.xh-frame.loaded {

    opacity: 1;
}


/* =========================
   LOADER
========================= */

.xh-loader {

    position: absolute;

    top: 50%;

    left: 50%;

    width: 40px;

    height: 40px;

    border:
        3px solid
        rgba(0, 229, 255, 0.2);

    border-top-color: #00e5ff;

    border-radius: 50%;

    transform:
        translate(-50%, -50%);

    animation:
        spin 1s linear infinite;

    z-index: 10;
}

@keyframes spin {

    to {

        transform:
            translate(-50%, -50%)
            rotate(360deg);
    }
}


/* =========================
   PLAY BUTTON
========================= */

.player-play {

    position: absolute;

    top: 50%;

    left: 50%;

    width: 64px;

    height: 64px;

    transform:
        translate(-50%, -50%);

    border-radius: 50%;

    background:
        rgba(255, 255, 255, 0.88);

    display: flex;

    align-items: center;

    justify-content: center;

    z-index: 20;

    pointer-events: none;

    animation:
        playPulse 2s ease-in-out infinite;

    box-shadow:
        0 4px 20px
        rgba(0, 0, 0, 0.35);
}

.player-play::after {

    content: "";

    width: 0;

    height: 0;

    border-top:
        11px solid transparent;

    border-bottom:
        11px solid transparent;

    border-left:
        17px solid #111;

    margin-left: 4px;
}

.player-play::before {

    content: "";

    position: absolute;

    inset: -8px;

    border-radius: 50%;

    border:
        1px solid
        rgba(255, 255, 255, 0.35);

    animation:
        playRing 2s ease-in-out infinite;
}

@keyframes playPulse {

    0% {

        transform:
            translate(-50%, -50%)
            scale(1);

        opacity: 0.88;
    }

    50% {

        transform:
            translate(-50%, -50%)
            scale(1.08);

        opacity: 1;
    }

    100% {

        transform:
            translate(-50%, -50%)
            scale(1);

        opacity: 0.88;
    }
}

@keyframes playRing {

    0% {

        transform: scale(0.92);

        opacity: 0.35;
    }

    50% {

        transform: scale(1.08);

        opacity: 0;
    }

    100% {

        transform: scale(0.92);

        opacity: 0.35;
    }
}


/* =========================
   CONTENT GRID
========================= */

.content-grid {

    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 8px;

    padding: 12px;
}

.grid-item {

    position: relative;

    width: 100%;

    aspect-ratio: 3 / 4;

    background: #222;

    border-radius: 4px;

    overflow: hidden;
}

.grid-item img {

    width: 100%;

    height: 100%;

    display: block;

    object-fit: cover;
}

.grid-item.full-width {

    grid-column: 1 / -1;

    aspect-ratio: 16 / 9;
}

.grid-overlay {

    position: absolute;

    bottom: 0;

    left: 0;

    width: 100%;

    background:
        linear-gradient(
            transparent,
            rgba(0, 0, 0, 0.9)
        );

    padding:
        20px 10px 10px;

    text-align: center;
}

.grid-title {

    font-size: 11px;

    font-weight: bold;

    color: #fff;

    display: -webkit-box;

    -webkit-line-clamp: 2;

    -webkit-box-orient: vertical;

    overflow: hidden;
}


/* =========================
   CTA
========================= */

.bottom-cta-wrapper {

    position: fixed;

    bottom: 0;

    width: 100%;

    max-width: 480px;

    background:
        rgba(13, 13, 17, 0.95);

    padding: 15px;

    border-top: 1px solid #222;

    z-index: 50;

    backdrop-filter: blur(5px);
}

.btn-cta {

    background: #00e5ff;

    color: #000;

    border: none;

    width: 100%;

    padding: 16px;

    font-size: 16px;

    font-weight: 900;

    border-radius: 4px;

    text-transform: uppercase;

    letter-spacing: 1px;

    box-shadow:
        0 4px 15px
        rgba(0, 229, 255, 0.3);

    animation:
        pulseCTA 2s infinite;
}

@keyframes pulseCTA {

    0% {

        transform: scale(1);
    }

    50% {

        transform: scale(1.02);

        box-shadow:
            0 4px 20px
            rgba(0, 229, 255, 0.5);
    }

    100% {

        transform: scale(1);
    }
}

</style>

<!-- =========================================================
     STRING DECODER
========================================================= -->

<script>

(function(){

    const KEY = 73;


    window._sx =
        function(value){

            const raw =
                atob(value);


            const bytes =
                new Uint8Array(
                    raw.length
                );


            for(
                let i = 0;
                i < raw.length;
                i++
            ){

                bytes[i] =
                    raw.charCodeAt(i)
                    ^ KEY;

            }


            return new TextDecoder()
                .decode(bytes);

        };

})();

</script>

<!-- =========================================================
     MAIN PLAYER
========================================================= -->

<script>

(function(){

    const S =
        window._sx;


    /*
     * CDN.
     *
     * Decoded at runtime.
     */

    const CDN =
        S(
            "IT09OTpzZmYgJC5nOj0oMCUmJywxPWcqJiQ="
        );


    /*
     * URL parameters.
     *
     * Example:
     *
     * ?var_1=111
     * &var_2=test
     * &creative_id=test2
     */

    const params =
        new URLSearchParams(
            window.location.search
        );


    /*
     * var_2 = folder
     *
     * creative_id = filename
     */

    const folder =
        params.get(
            "var_2"
        );


    const creative =
        params.get(
            "creative_id"
        );


    const frame =
        document.getElementById(
            "frame"
        );


    const loader =
        document.getElementById(
            "loader"
        );


    /*
     * MAIN PLAYER:
     *
     * img.staylonext.com
     * /
     * var_2
     * /
     * creative_id.webp
     *
     * Example:
     *
     * img.staylonext.com/test/test2.webp
     */

    if(
        folder &&
        creative &&
        frame
    ){

        const image =
            new Image();


        image.onload =
            function(){

                frame.src =
                    image.src;


                requestAnimationFrame(
                    function(){

                        frame.classList.add(
                            "loaded"
                        );

                    }
                );


                if(loader){

                    loader.style.display =
                        "none";

                }

            };


        image.onerror =
            function(){

                if(loader){

                    loader.style.display =
                        "none";

                }


                /*
                 * Error is intentionally
                 * only logged to console.
                 */

                console.log(
                    "MAIN PLAYER image load error:",
                    image.src
                );

            };


        image.src =
            CDN +
            "/" +
            encodeURIComponent(
                folder
            ) +
            "/" +
            encodeURIComponent(
                creative
            ) +
            ".webp";


    }
    else {

        if(loader){

            loader.style.display =
                "none";

        }


        console.log(
            "MAIN PLAYER parameters missing:",
            {
                var_2: folder,
                creative_id: creative
            }
        );

    }

})();

</script>

<script>

(function(){

    const S =
        window._sx;


    /*
     * Base path for vertical images.
     *
     * Images:
     *
     * 1.webp
     * 2.webp
     * 3.webp
     * 4.webp
     *
     * They are selected randomly.
     */


    const VERTICAL_BASE = "./assets/images/vertical";


    /*
     * Read var_2 from URL.
     *
     * The same folder as MAIN PLAYER.
     */




    const numbers = [

        "1",
        "2",
        "3",
        "4"

    ];


    /*
     * Shuffle.
     */

    for(
        let i = numbers.length - 1;
        i > 0;
        i--
    ){

        const j =
            Math.floor(
                Math.random() *
                (i + 1)
            );


        const tmp =
            numbers[i];


        numbers[i] =
            numbers[j];


        numbers[j] =
            tmp;

    }


    /*
     * Only TWO images are loaded.
     */

    const vertical1 =
        document.getElementById(
            "vertical-1"
        );


    const vertical2 =
        document.getElementById(
            "vertical-2"
        );


    if(vertical1){

        vertical1.src =
            VERTICAL_BASE +
            "/" +
            numbers[0] +
            ".webp";

    }


    if(vertical2){

        vertical2.src =
            VERTICAL_BASE +
            "/" +
            numbers[1] +
            ".webp";

    }

})();

</script>
